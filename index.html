<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Лісова Пісня</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{
  background:#020617;color:#fff;font-family:Arial;
  display:flex;justify-content:center;align-items:center;min-height:100vh
}
.box{
  width:360px;background:#020617;padding:20px;border-radius:16px;
  box-shadow:0 0 30px rgba(0,0,0,.6)
}
input,button{
  width:100%;padding:12px;margin-top:8px;border-radius:10px;border:none
}
input{background:#0f172a;color:#fff}
button{background:#22c55e;font-weight:bold}
.hidden{display:none}
</style>
</head>
<body>

<div class="box">
<h2>🌲 Лісова Пісня</h2>

<div id="loginBox">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Пароль">
  <button onclick="login()">Увійти</button>
</div>

<div id="userBox" class="hidden">
  <p>👤 Імʼя: <b id="name"></b></p>
  <p>🆔 ID: <b id="idd"></b></p>
  <p>💰 Баланс: <b id="balance">0</b></p>

  <button onclick="go('services.html')">🛎 Послуги</button>
  <button onclick="go('transfer.html')">💸 Переказ</button>
  <button onclick="openPrivat()">💳 Поповнити (Privat24)</button>
  <button onclick="logout()">🚪 Вийти</button>
</div>
</div>

<script src="app.js"></script>
</body>
</html>
